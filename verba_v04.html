<style>
  :root { --bg:#10161d; --frame:#e9d8a6; --frame2:#34495a; --ink:#efe6c8; --muted:#9fb2b6; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:'Pixelify Sans', ui-monospace, monospace; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; min-height:100%; }
  header { width:100%; max-width:1200px; display:flex; justify-content:space-between; align-items:baseline;
    padding:10px 16px 6px; gap:12px; }
  header h1 { margin:0; font-size:18px; font-weight:600; letter-spacing:.5px; }
  header small { color:var(--muted); font-size:13px; }
  #stage { position:relative; border:4px solid var(--frame); box-shadow:0 0 0 4px var(--frame2), 0 10px 30px #0008;
    border-radius:6px; background:#000; line-height:0; }
  canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  #help { display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; padding:10px 16px; font-size:13px; color:#d9d6c2; }
  #help b { display:inline-block; background:#2c3c48; border:1px solid #6d7f86; border-radius:4px; padding:1px 6px; font-weight:400; }
  #touch { display:none; width:100%; max-width:520px; justify-content:space-between; align-items:center;
    padding:8px 18px 22px; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  body.touch #touch { display:flex; }
  body.touch #help { display:none; }
  #pad { position:relative; width:150px; height:150px; border-radius:50%; background:#1f2b34; border:2px solid #4b5d66; touch-action:none; }
  #pad .arm { position:absolute; background:#3a4c56; border:2px solid #c9b47c; border-radius:8px; color:#f3ead0;
    display:flex; align-items:center; justify-content:center; font-size:18px; }
  #pad .u { left:52px; top:6px; width:46px; height:52px; } #pad .d { left:52px; bottom:6px; width:46px; height:52px; }
  #pad .l { top:52px; left:6px; width:52px; height:46px; } #pad .r { top:52px; right:6px; width:52px; height:46px; }
  #pad .arm.on { background:#c9b47c; color:#1f2b34; }
  #btns { display:grid; grid-template-columns:repeat(2,64px); gap:12px; align-items:center; }
  #btns button { width:64px; height:64px; border-radius:50%; border:2px solid #c9b47c; background:#7a2f37; color:#fff;
    font:600 20px 'Pixelify Sans', monospace; touch-action:none; }
  #btns button small { display:block; font-size:10px; font-weight:400; opacity:.8; }
  #btns button[data-act=b] { background:#2f4f7a; }
  #btns button[data-act=map] { grid-column:1 / span 2; justify-self:center; width:90px; height:36px; border-radius:18px; background:#3a4c56; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>Понорницькі пригоди — Верба</h1>
  <small>v0.4 · центр села · тест руху й графіки</small>
</header>
<div id="stage"><canvas id="game" width="384" height="240"></canvas></div>
<div id="help">
  <span><b>WASD / ↑↓←→</b> рух</span>

  <span><b>E / Space / Enter</b> дія</span>
  <span><b>M</b> карта</span>
  <span><b>L</b> підписи</span>
  <span><b>G</b> сітка</span>
  <span><b>R</b> на старт</span>
</div>
<div id="touch">
  <div id="pad"><div class="arm u">▲</div><div class="arm l">◀</div><div class="arm r">▶</div><div class="arm d">▼</div></div>
  <div id="btns">
    <button data-act="b" tabindex="-1">B<small>біг</small></button>
    <button data-act="a" tabindex="-1">A<small>дія</small></button>

</div>

<!-- ============================================================
     ENGINE
     ============================================================ -->
<script>
'use strict';
const M = VERBA_MAP, TS = 16, VW = 384, VH = 240, MW = M.w, MH = M.h;
const FONT = "'Pixelify Sans', ui-monospace, monospace";
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

// ---------- helpers ----------
function hash(x, y, s = 0) {
  let v = (x * 374761393 + y * 668265263 + s * 1442695041) | 0;
  v = Math.imul(v ^ (v >>> 13), 1274126177);
  return ((v ^ (v >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y, sc, s) {
  const fx = x / sc, fy = y / sc, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
  const a = hash(x0, y0, s), b = hash(x0 + 1, y0, s), c = hash(x0, y0 + 1, s), d = hash(x0 + 1, y0 + 1, s);
  const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
  return (a * (1 - sx) + b * sx) * (1 - sy) + (c * (1 - sx) + d * sx) * sy;
}
function R(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
const idx = (x, y) => y * MW + x;
const inb = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH;

// ---------- tiny pixel font for signboards (3–5 px wide, 5 px tall) ----------
const GLYPH = {
  'М':['#...#','##.##','#.#.#','#...#','#...#'], 'А':['.#.','#.#','###','#.#','#.#'], 'Г':['###','#..','#..','#..','#..'],
  'З':['##.','..#','.#.','..#','##.'], 'И':['#..#','#..#','#.##','##.#','#..#'], 'Н':['#.#','#.#','###','#.#','#.#'],
  'Л':['.##','#.#','#.#','#.#','#.#'], 'Р':['##.','#.#','##.','#..','#..'], 'Ь':['#..','#..','##.','#.#','##.'],
  'О':['.#.','#.#','#.#','#.#','.#.'], 'К':['#.#','#.#','##.','#.#','#.#'], 'П':['###','#.#','#.#','#.#','#.#'],
  'Ж':['#.#.#','#.#.#','.###.','#.#.#','#.#.#'], 'Е':['###','#..','##.','#..','###'], 'С':['.##','#..','#..','#..','.##'],
  'І':['#','#','#','#','#'], 'Д':['.##.','.#.#','.#.#','####','#..#'], ' ':['..','..','..','..','..'],
};
function pixTextWidth(s) { let w = 0; for (const ch of s) w += (GLYPH[ch] || GLYPH[' '])[0].length + 1; return w - 1; }
function pixText(g, s, x, y, col) {
  g.fillStyle = col;
  for (const ch of s) { const gl = GLYPH[ch] || GLYPH[' ']; gl.forEach((row, j) => { for (let i = 0; i < row.length; i++) if (row[i] === '#') g.fillRect(x + i, y + j, 1, 1); }); x += gl[0].length + 1; }
}

// ---------- world grids ----------
const kind = new Array(MW * MH).fill('g');
const solid = new Uint8Array(MW * MH);
const thingAt = new Array(MW * MH).fill(null);
const dashRects = [];
for (const r of M.ground) {
  for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) if (inb(x, y)) kind[idx(x, y)] = r.k;
  if (r.dash) dashRects.push(r);
}
const K = (x, y) => inb(x, y) ? kind[idx(x, y)] : null;
const isRoad = k => k === 'r' || k === 'k';

const things = []; // everything drawn as an object (buildings, trees, props)
function addThing(t) {
  things.push(t);
  if (t.solid !== false) for (let y = t.y; y < t.y + t.h; y++) for (let x = t.x; x < t.x + t.w; x++) if (inb(x, y)) { solid[idx(x, y)] = 1; thingAt[idx(x, y)] = t; }
}
for (const b of M.buildings) addThing({ ...b, cat:'building' });
for (const o of M.objects) {
  if (o.k === 'hedge') { for (let y = o.y; y < o.y + o.h; y++) for (let x = o.x; x < o.x + o.w; x++) addThing({ k:'hedge', x, y, w:1, h:1 }); }
  else if (o.k === 'fence') {
    const gates = new Set((o.gates || []).map(([a, b]) => a + ',' + b));
    for (let y = o.y; y < o.y + o.h; y++) for (let x = o.x; x < o.x + o.w; x++) {
      const edge = x === o.x || x === o.x + o.w - 1 || y === o.y || y === o.y + o.h - 1;
      if (!edge || gates.has(x + ',' + y)) continue;
      const vertical = (x === o.x || x === o.x + o.w - 1) && y !== o.y && y !== o.y + o.h - 1;
      addThing({ k:'fence', x, y, w:1, h:1, vertical, msg:null });
    }
  }
  else if (o.k === 'car') addThing({ ...o, w:1, h:2, msg:'Чиясь машина. Краще не чіпати.' });
  else addThing({ ...o, w:1, h:1, msg: o.k === 'lamp' ? 'Ліхтар. Увечері тут світло.' : o.k === 'bench' ? 'Лавка. Можна посидіти… колись.' : o.k === 'flag' ? 'Прапор України над сільрадою.' : null });
}
// flowers (walkable decoration)
const flowerTiles = new Map();
for (const f of M.flowers) for (let y = f.y; y < f.y + f.h; y++) for (let x = f.x; x < f.x + f.w; x++)
  if (K(x, y) === 'g' && !solid[idx(x, y)] && hash(x, y, 31) < f.density) flowerTiles.set(idx(x, y), 1 + Math.floor(hash(x, y, 32) * 4));
// generated trees
function nearFeature(x, y) {
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const k = K(x + i, y + j); if (k && k !== 'g') return true;
    const t = inb(x + i, y + j) ? thingAt[idx(x + i, y + j)] : null;
    if (t && t.k !== 'tree' && t.k !== 'pine' && t.k !== 'bush') return true;
  }
  return false;
}
const sp = M.spawn;
for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
  if (K(x, y) !== 'g' || solid[idx(x, y)] || flowerTiles.has(idx(x, y))) continue;
  if (x >= 6 && x <= 15 && y >= 7 && y <= 17) continue; // church yard is fenced; trees placed by hand
  const B = M.forest.border, edge = x < B || y < B || x >= MW - B || y >= MH - B;
  const h = hash(x, y, 5);
  let put = false;
  if (edge) put = h < M.forest.borderDensity || (x < 2 || y < 2 || x >= MW - 2 || y >= MH - 2);
  else if (!nearFeature(x, y) && Math.abs(x - sp.x) + Math.abs(y - sp.y) > 3) {
    put = h < M.forest.scatter || (vnoise(x, y, 5, 9) > 0.6 && h < 0.72);
    if (!put && hash(x, y, 8) < 0.06) { addThing({ k:'bush', x, y, w:1, h:1, v: Math.floor(hash(x, y, 9) * 2), msg:'Густий кущ.' }); continue; }
  }
  if (put) addThing({ k: hash(x, y, 6) < 0.3 ? 'pine' : 'tree', x, y, w:1, h:1, v: Math.floor(hash(x, y, 7) * 3) });
}
// random wild flowers on grass
for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++)
  if (K(x, y) === 'g' && !solid[idx(x, y)] && !flowerTiles.has(idx(x, y)) && hash(x, y, 33) < 0.035) flowerTiles.set(idx(x, y), 1 + Math.floor(hash(x, y, 34) * 4));

// ---------- palettes ----------
const PAL = {
  grass:'#7fcc5e', grass2:'#8bd468', grassD:'#61ad4a', grassL:'#a6e27e',
  asph:'#878793', asphL:'#9898a4', asphD:'#74747f', curb:'#c4c4cc', curbD:'#5f5f6a', park:'#7f7f8b',
  pave:'#dcc89c', paveL:'#ecdcb4', paveD:'#bfa77c', paveE:'#a8915f',
  dirt:'#d9b67a', dirtD:'#c29b5e', dirtL:'#e8cc96',
  conc:'#bdbab0', concD:'#a19e94',
  ol:'#2b2430',
};

// ---------- tile painters ----------
function paintGrass(g, X, Y, x, y) {
  R(g, X, Y, TS, TS, PAL.grass);
  // large soft patches of lighter grass (dithered edge instead of a per-tile checkerboard)
  for (let j = 0; j < TS; j += 2) for (let i = (j / 2) % 2; i < TS; i += 2)
    if (vnoise(X + i, Y + j, 56, 3) > 0.56) R(g, X + i, Y + j, 2, 2, PAL.grass2);
    else if (vnoise(X + i, Y + j, 56, 3) > 0.53 && (i + j) % 4 === 0) R(g, X + i, Y + j, 1, 1, PAL.grass2);
  // soft dither patches
  for (let i = 0; i < 5; i++) { const a = Math.floor(hash(x, y, 40 + i) * 16), b = Math.floor(hash(x, y, 50 + i) * 16); R(g, X + a, Y + b, 1, 1, hash(x, y, 60 + i) > 0.5 ? PAL.grassL : PAL.grassD); }
  const n = Math.floor(hash(x, y, 2) * 3);
  for (let t = 0; t < n; t++) {
    const a = 2 + Math.floor(hash(x, y, 10 + t) * 11), b = 3 + Math.floor(hash(x, y, 20 + t) * 9);
    R(g, X + a, Y + b, 1, 2, PAL.grassD); R(g, X + a + 2, Y + b, 1, 2, PAL.grassD); R(g, X + a + 1, Y + b + 1, 1, 2, PAL.grassD);
    R(g, X + a + 1, Y + b - 1, 1, 1, PAL.grassL);
  }
  // shade next to paved surfaces (grass is slightly above, small shadow line)
  if (isRoad(K(x, y - 1))) R(g, X, Y, TS, 1, PAL.grassD);
}

const P = { tx:sp.x, ty:sp.y, fx:sp.x, fy:sp.y, prog:0, moving:false, facing:sp.dir, parity:0, restDir:null, turnT:0, bumpT:0 };

    if (P.prog >= 1) {

// ---------- keyboard ----------
addEventListener('keydown', e => {
  if (e.code in CODE_DIR || e.code === 'Space' || e.code === 'Enter') e.preventDefault();
  if (e.repeat) return;
  const d = CODE_DIR[e.code];
  if (d) { input.press(e.code, d); return; }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyX') input.run.add(e.code);
  else if (e.code === 'KeyE' || e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyZ') action();
  else if (e.code === 'KeyM') { ui.map = !ui.map; ui.dialog = null; }
  else if (e.code === 'Escape') { ui.map = false; ui.dialog = null; }
  else if (e.code === 'KeyL') ui.labels = !ui.labels;
  else if (e.code === 'KeyG') ui.grid = !ui.grid;

// ---------- canvas sizing (integer internal scale = crisp pixels) ----------
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let S = 3;
function resize() {

  css = Math.max(0.5, css);
  const dpr = devicePixelRatio || 1;
  S = Math.max(1, Math.round(css * dpr));

  ctx.imageSmoothingEnabled = false;
}

  ctx.drawImage(groundC, cam.x, cam.y, VW, VH, 0, 0, VW, VH);
  const h = heroPixel(), hx = Math.round(h.x - cam.x), hy = Math.round(h.y - cam.y);
  ctx.fillStyle = 'rgba(20,40,20,.30)'; ctx.beginPath(); ctx.ellipse(hx + 8, hy + 14, 6, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.drawImage(heroFrame(), hx, hy - 9);
  ctx.drawImage(overC, cam.x, cam.y, VW, VH, 0, 0, VW, VH);

  if (ui.grid) {
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    for (let x = -(cam.x % TS); x < VW; x += TS) ctx.fillRect(x, 0, 1 / S, VH);
    for (let y = -(cam.y % TS); y < VH; y += TS) ctx.fillRect(0, y, VW, 1 / S);
  }
  // world labels (native resolution text)
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (ui.labels && !ui.map) {
    ctx.font = uiFont(6.5, true); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const L of LABELS) {
      const sx = (L.x - cam.x) * S, sy = (L.y - cam.y) * S; if (sx < -200 || sx > VW * S + 200 || sy < -40 || sy > VH * S + 40) continue;
      const w = ctx.measureText(L.text).width + 8 * S, hh = 10 * S;
      ctx.fillStyle = '#4a3c2a'; ctx.fillRect(sx - w / 2 - S, sy - hh / 2 - S, w + 2 * S, hh + 2 * S);
      ctx.fillStyle = '#fbf2d4'; ctx.fillRect(sx - w / 2, sy - hh / 2, w, hh);
      ctx.fillStyle = '#2e2a26'; ctx.fillText(L.text, sx, sy + 0.5 * S);
    }
  }
  // location banner
  if (ui.banner > 0) {
    const t = ui.banner, slide = t > 2.9 ? (3.2 - t) / 0.3 : t < 0.3 ? t / 0.3 : 1, y = Math.round((-30 + 36 * slide) * S);
    ctx.fillStyle = '#5a3f26'; ctx.fillRect(6 * S, y, 130 * S, 24 * S);
    ctx.fillStyle = '#f4e6c0'; ctx.fillRect(8 * S, y + 2 * S, 126 * S, 20 * S);
    ctx.fillStyle = '#c9b07a'; ctx.fillRect(8 * S, y + 19 * S, 126 * S, 3 * S);
    ctx.font = uiFont(9, true); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#3a2c1c';
    ctx.fillText(M.name, 71 * S, y + 11 * S);
  }
  if (ui.grid) {
    ctx.font = uiFont(7); ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    const s = `x ${P.tx}  y ${P.ty}  ${P.facing}`; const w = ctx.measureText(s).width + 8 * S;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(VW * S - w - 4 * S, 4 * S, w, 12 * S); ctx.fillStyle = '#fff'; ctx.fillText(s, VW * S - 8 * S, 6 * S);
  }
  if (ui.dialog) drawDialog();
  if (ui.map) drawMap();
}
function drawDialog() {
  const d = ui.dialog, x = 8 * S, y = 174 * S, w = 368 * S, h = 60 * S;
  ctx.fillStyle = '#2f4c86'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#f7f7fb'; ctx.fillRect(x + 2 * S, y + 2 * S, w - 4 * S, h - 4 * S);
  ctx.fillStyle = '#c3cde3'; ctx.fillRect(x + 4 * S, y + 4 * S, w - 8 * S, S); ctx.fillRect(x + 4 * S, y + h - 5 * S, w - 8 * S, S);
  ctx.font = uiFont(10); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  const text = d.text.slice(0, Math.floor(d.shown)), words = text.split(' '), lines = [''];
  for (const wd of words) { const t = lines[lines.length - 1] ? lines[lines.length - 1] + ' ' + wd : wd; if (ctx.measureText(t).width > w - 28 * S) lines.push(wd); else lines[lines.length - 1] = t; }
  lines.slice(0, 3).forEach((ln, i) => { ctx.fillStyle = '#d6d6de'; ctx.fillText(ln, x + 13 * S, y + (10 + i * 15) * S + S); ctx.fillStyle = '#303040'; ctx.fillText(ln, x + 12 * S, y + (10 + i * 15) * S); });
  if (d.shown >= d.text.length && Math.floor(ui.time * 3) % 2) { ctx.fillStyle = '#d24b43'; const ax = x + w - 18 * S, ay = y + h - 16 * S; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + 8 * S, ay); ctx.lineTo(ax + 4 * S, ay + 5 * S); ctx.fill(); }
}
function drawMap() {
  ctx.fillStyle = 'rgba(12,20,28,.78)'; ctx.fillRect(0, 0, VW * S, VH * S);
  const sc = Math.min(340 / (MW * TS), 196 / (MH * TS)), mw = MW * TS * sc, mh = MH * TS * sc, mx = (VW - mw) / 2, my = 30;
  ctx.fillStyle = '#e9d8a6'; ctx.fillRect((mx - 3) * S, (my - 3) * S, (mw + 6) * S, (mh + 6) * S);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(groundC, mx * S, my * S, mw * S, mh * S); ctx.drawImage(overC, mx * S, my * S, mw * S, mh * S);
  ctx.imageSmoothingEnabled = false;
  ctx.font = uiFont(11, true); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#f5edcb';
  ctx.fillText('КАРТА · ЦЕНТР ВЕРБИ', VW / 2 * S, 15 * S);
  ctx.font = uiFont(6, true);
  for (const L of LABELS) {
    const sx = (mx + L.x * sc) * S, sy = (my + (L.y + 16) * sc) * S, w = ctx.measureText(L.text).width + 6 * S;
    ctx.fillStyle = 'rgba(251,242,212,.92)'; ctx.fillRect(sx - w / 2, sy - 5 * S, w, 10 * S); ctx.fillStyle = '#2e2a26'; ctx.fillText(L.text, sx, sy + 0.5 * S);
  }
  const h = heroPixel();
  if (Math.floor(ui.time * 4) % 2) { ctx.fillStyle = '#e8303a'; ctx.beginPath(); ctx.arc((mx + (h.x + 8) * sc) * S, (my + (h.y + 8) * sc) * S, 3.5 * S, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = S; ctx.stroke(); }
  ctx.font = uiFont(7); ctx.fillStyle = '#c9d4d6'; ctx.fillText('M / Esc — закрити', VW / 2 * S, (VH - 8) * S);
}

// ---------- loop ----------
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t;
  update(dt); render();
  requestAnimationFrame(frame);
}
renderWorld();
resize();
say('Знову у Вербі… Рухайся WASD або стрілками, E — взаємодія, M — карта.');
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});

// debug/test hook
window.VERBA = { P, ui, input, update, solid, kind, things, passable, action, resetHero, M };
</script>
