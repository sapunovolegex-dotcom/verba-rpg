<style>
  :root { --bg:#10161d; --frame:#e9d8a6; --frame2:#34495a; --ink:#efe6c8; --muted:#9fb2b6; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:'Pixelify Sans', ui-monospace, monospace; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; align-items:center; min-height:100%; }
  header { width:100%; max-width:1200px; display:flex; justify-content:space-between; align-items:baseline; padding:10px 16px 6px; gap:12px; }
  header h1 { margin:0; font-size:18px; font-weight:600; letter-spacing:.5px; }
  header small { color:var(--muted); font-size:13px; }
  #stage { position:relative; border:4px solid var(--frame); box-shadow:0 0 0 4px var(--frame2), 0 10px 30px #0008; border-radius:6px; background:#000; line-height:0; }
  canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  #help { display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; padding:10px 16px; font-size:13px; color:#d9d6c2; }
  #help b { display:inline-block; background:#2c3c48; border:1px solid #6d7f86; border-radius:4px; padding:1px 6px; font-weight:400; }
  #touch { display:none; width:100%; max-width:520px; justify-content:space-between; align-items:center; padding:8px 18px 22px;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  body.touch #touch { display:flex; }
  body.touch #help { display:none; }
  #pad { position:relative; width:150px; height:150px; border-radius:50%; background:#1f2b34; border:2px solid #4b5d66; touch-action:none; }
  #pad .arm { position:absolute; background:#3a4c56; border:2px solid #c9b47c; border-radius:8px; color:#f3ead0; display:flex; align-items:center; justify-content:center; font-size:18px; }
  #pad .u { left:52px; top:6px; width:46px; height:52px; } #pad .d { left:52px; bottom:6px; width:46px; height:52px; }
  #pad .l { top:52px; left:6px; width:52px; height:46px; } #pad .r { top:52px; right:6px; width:52px; height:46px; }
  #pad .arm.on { background:#c9b47c; color:#1f2b34; }
  #btns { display:grid; grid-template-columns:repeat(2,64px); gap:12px; align-items:center; }
  #btns button { width:64px; height:64px; border-radius:50%; border:2px solid #c9b47c; background:#7a2f37; color:#fff; font:600 20px 'Pixelify Sans', monospace; touch-action:none; }
  #btns button small { display:block; font-size:10px; font-weight:400; opacity:.8; }
  #btns button[data-act=b] { background:#2f4f7a; }
  #btns button[data-act=map] { grid-column:1 / span 2; justify-self:center; width:90px; height:36px; border-radius:18px; background:#3a4c56; font-size:14px; }
  #mini { position:fixed; inset:0; z-index:50; display:none; flex-direction:column; background:#0c1218f2; }
  #mini.on { display:flex; }
  #mini .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 14px; background:#2a1f16; border-bottom:3px solid #e9d8a6; }
  #mini .bar span { font-size:15px; color:#f3e3b5; }
  #mini .bar button { font:600 14px 'Pixelify Sans', monospace; background:#e9d8a6; color:#2a1f16; border:2px solid #0b1018; border-radius:6px; padding:6px 12px; cursor:pointer; }
  #mini iframe { flex:1; width:100%; border:0; background:#161d28; }
</style>
</head>
<body>
<header>
  <h1>Понорницькі пригоди — Верба</h1>
  <small>v0.15 · уся Верба · гаманець</small>
</header>
<div id="stage"><canvas id="game" width="384" height="240"></canvas></div>
<div id="help">

</div>
<div id="touch">
  <div id="pad"><div class="arm u">▲</div><div class="arm l">◀</div><div class="arm r">▶</div><div class="arm d">▼</div></div>
  <div id="btns">
    <button data-act="b" tabindex="-1">B<small>біг</small></button>
    <button data-act="a" tabindex="-1">A<small>дія</small></button>
    <button data-act="map" tabindex="-1">КАРТА</button>
  </div>
</div>
<div id="mini" role="dialog" aria-label="Мінігра в гаражі">
  <div class="bar"><span>Гараж · Картопляний сезон</span><button id="miniClose" type="button">✕ Назад у Вербу (Esc)</button></div>
  <iframe id="miniFrame" title="Картопляний сезон"></iframe>
</div>

<script type="text/plain" id="potato-src"><!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Верба — Сортування картоплі</title><style>*{box-sizing:border-box}body{margin:0;background:#161d28;color:#f8edcc;font-family:Verdana,Arial,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:16px}#app{width:min(980px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}h1{font-size:clamp(19px,3vw,30px);margin:0;color:#f7d77e}small{color:#b6c8b6}button{cursor:pointer;font:inherit} .btn{border:3px solid #0b1018;border-radius:7px;background:#e8c67b;color:#242020;padding:10px 15px;box-shadow:inset 0 0 0 2px #fff1b8;font-weight:bold}.btn:hover{filter:brightness(1.08)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.stat{flex:1;min-width:110px;background:#273b42;border:3px solid #101820;border-radius:7px;padding:10px;text-align:center}.stat b{font-size:22px;color:#f8e9b3;display:block}.stat span{font-size:12px;color:#d3ddca}#scene{position:relative;background:#456e3b;border:5px solid #111a1d;border-radius:10px;overflow:hidden;box-shadow:0 8px 0 #0c1219}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none;cursor:pointer}.hint{padding:13px 16px;background:#f1e7c6;color:#252b26;border:4px solid #17222b;border-radius:8px;margin-top:12px;font-size:14px;line-height:1.55}.hint strong{color:#6c4523}#msg{min-height:26px;font-weight:bold}.legend{display:flex;gap:8px;justify-content:space-around;flex-wrap:wrap}.pill{background:#344b43;border:2px solid #12211f;border-radius:7px;padding:7px 11px;font-size:12px}.footer{font-size:12px;color:#9db5a6;margin-top:12px;text-align:center}@media(max-width:600px){body{padding:7px}.stats{gap:5px}.stat{padding:6px;min-width:70px}.stat b{font-size:18px}.hint{font-size:12px}}</style></head><body><div id="app"><header><div><h1>🥔 Картопляний сезон</h1><small>Понорницькі пригоди · Верба · Мінігра v0.3 · На швидкість</small></div><button class="btn" id="restart">↻ Нова гра</button></header><div class="stats"><div class="stat"><b id="score">0</b><span>Очки</span></div><div class="stat"><b id="sorted">0 / 20</b><span>Відсортовано</span></div><div class="stat"><b id="errors">0</b><span>Помилки</span></div><div class="stat"><b id="combo">×0</b><span>Серія</span></div><div class="stat"><b id="timer">0.0 с</b><span>Час роботи</span></div></div><div id="scene"><canvas id="game" width="960" height="610" aria-label="Мінігра сортування картоплі: затисніть картоплину в купі та перетягніть до кошика"></canvas></div><div class="hint"><div id="msg" aria-live="polite">Затисни картоплину в купі та перетягни до кошика!</div><div class="legend"><span class="pill">⚡ До 1 с: +30 · 1–2 с: +25 · 2–3 с: +20 · 3–5 с: +15 · понад 5 с: +10 · помилка: −10</span><span class="pill">① Затисни картоплю</span><span class="pill">② Перетягни картоплину</span><span class="pill">③ Відпусти над кошиком</span></div></div><div class="footer">Можна грати мишкою або пальцем · Усі малюнки створені програмно · Працює офлайн</div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const $=id=>document.getElementById(id);const W=960,H=610;let state,particles=[],time=0;const baskets=[{x:75,y:405,w:240,h:155,size:0,name:'ДРИБНА',color:'#e7c780'},{x:360,y:405,w:240,h:155,size:1,name:'СІМЕННА',color:'#e6c285'},{x:645,y:405,w:240,h:155,size:2,name:'БУЙНА',color:'#e9c98c'}];const rng=(a,b)=>a+Math.random()*(b-a);function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function line(x,y,x2,y2,c,width=2){ctx.strokeStyle=c;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}function txt(s,x,y,size=20,color='#fff4d6',align='center'){ctx.fillStyle='#182020';ctx.font=`bold ${size}px monospace`;ctx.textAlign=align;ctx.fillText(s,x+2,y+3);ctx.fillStyle=color;ctx.fillText(s,x,y)}function potato(x,y,r,seed=0){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(seed*8)*.23);ctx.fillStyle='#6b3e21';ctx.beginPath();ctx.ellipse(3,5,r*1.12,r*.82,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b98445';ctx.beginPath();ctx.ellipse(0,0,r*1.08,r*.84,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#dfaa61';ctx.beginPath();ctx.ellipse(-r*.2,-r*.22,r*.65,r*.34,-.2,0,Math.PI*2);ctx.fill();for(let i=0;i<4;i++){let a=i*2.5+seed;rect(Math.cos(a)*r*.65,Math.sin(a)*r*.44,Math.max(2,r*.11),Math.max(2,r*.09),'#80532e')}ctx.restore()}function reset(){state={score:0,sorted:0,errors:0,combo:0,selected:null,drag:null,done:false,basketCounts:[0,0,0],flash:-1,startTime:null,pickTime:null,endTime:null};particles=[];$('msg').textContent='Затисни картоплину в купі та перетягни до кошика!';update()}function update(){$('score').textContent=state.score;$('sorted').textContent=`${state.sorted} / 20`;$('errors').textContent=state.errors;$('combo').textContent='×'+state.combo;$('timer').textContent=(((state.endTime??performance.now())-(state.startTime??performance.now()))/1000).toFixed(1)+' с'}function pick(x,y){if(state.done||state.selected!==null)return;if(state.startTime===null)state.startTime=performance.now();state.pickTime=performance.now();state.selected=Math.floor(Math.random()*3);state.drag={x,y};$('msg').textContent='Тримай і перетягни картоплину в кошик: ДРИБНА, СІМЕННА або БУЙНА.';burst(x,y,'#e7bb73',8)}function burst(x,y,color,n=18){for(let i=0;i<n;i++)particles.push({x,y,vx:rng(-4,4),vy:rng(-6,-1),life:rng(22,42),color})}function pointsForSeconds(sec){return sec<1?30:sec<2?25:sec<3?20:sec<5?15:10}
function place(i){if(state.done)return;if(state.selected===null){$('msg').textContent='Спочатку візьми картоплину з купи!';return}if(i===state.selected){const sec=(performance.now()-state.pickTime)/1000;const earned=pointsForSeconds(sec);state.score+=earned;state.combo++;state.sorted++;state.basketCounts[i]++;state.flash=i;burst(baskets[i].x+120,465,'#ffe184');$('msg').textContent=`✓ Правильно за ${sec.toFixed(1)} с! +${earned} очок. Швидше — більше очок!`;state.selected=null;state.drag=null;state.pickTime=null;if(state.sorted>=20){state.done=true;state.endTime=performance.now();try{parent.postMessage({type:'potato-done',score:state.score,errors:state.errors,time:(state.endTime-state.startTime)/1000},'*')}catch(_){}const total=(state.endTime-state.startTime)/1000;$('msg').textContent=`🎉 Урожай відсортовано за ${total.toFixed(1)} с! Результат: ${state.score} очок.`}}else{state.errors++;state.score=Math.max(0,state.score-10);state.combo=0;state.flash=i;burst(baskets[i].x+120,465,'#e86e65',12);$('msg').textContent='✗ Не той кошик! −10 очок. Візьми нову картоплину.';state.selected=null;state.drag=null;state.pickTime=null}update()}
function coords(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function basketAt(x,y){return baskets.findIndex(b=>x>=b.x-8&&x<=b.x+b.w+8&&y>=b.y-15&&y<=b.y+b.h+16)}
canvas.addEventListener('pointerdown',e=>{if(state.done||state.drag)return;const {x,y}=coords(e);if(x>=90&&x<=465&&y>=160&&y<=385){pick(x,y);canvas.setPointerCapture(e.pointerId)}});
canvas.addEventListener('pointermove',e=>{if(state.drag){const {x,y}=coords(e);state.drag={x,y}}});
function release(e){if(!state.drag)return;const {x,y}=coords(e);const i=basketAt(x,y);if(i>=0){place(i)}else{$('msg').textContent='Не попав у кошик! Спробуй ще раз.';state.selected=null;state.drag=null;state.pickTime=null}if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId)}
canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',()=>{state.selected=null;state.drag=null;state.pickTime=null});
$('restart').onclick=reset;function draw(){time++;if(state.startTime!==null&&!state.done)$('timer').textContent=((performance.now()-state.startTime)/1000).toFixed(1)+' с';rect(0,0,W,H,'#83ad60');for(let y=0;y<H;y+=32)for(let x=0;x<W;x+=32){const v=(x*17+y*31)%11;rect(x+v*2,y+(v*7)%21,3,3,v%3===0?'#a0c47a':'#719e53')}rect(0,0,W,82,'#263b3e');rect(0,79,W,5,'#17272a');txt('ВЕРБА • СОРТУВАННЯ КАРТОПЛІ',480,35,27);txt('Обери розмір і поклади у правильний кошик',480,66,16,'#cbd8bd');rect(50,113,425,282,'#a67c4d');rect(56,119,413,270,'#b58d58');for(let y=122;y<390;y+=25)line(60,y,464,y,'#a67e4e',2);txt('КУПА КАРТОПЛІ',263,148,21,'#fff6d9');for(let i=0;i<72;i++){const row=Math.floor(i/12),col=i%12;const px=113+col*28+(row%2)*10,py=204+row*27;potato(px,py,14+(i*7)%7,i)}rect(115,361,300,25,'#6b4c2c');txt('ЗАТИСНИ Й ТЯГНИ',265,381,16);rect(503,111,406,284,'#d3bc83');rect(509,117,394,272,'#eedaa7');txt('ТВОЯ КАРТОПЛИНА',707,149,21,'#3b3227');if(state.selected===null){txt('?',707,290,100,'#b7a77c');txt('Тягни з купи →',707,359,18,'#61513d')}else{const r=[25,43,66][state.selected];potato(707,266+Math.sin(time*.06)*4,r,3);txt(['ДРИБНА','СІМЕННА','БУЙНА'][state.selected],707,365,23,'#473321')}for(let i=0;i<3;i++){let b=baskets[i];rect(b.x-7,b.y+10,b.w+14,b.h-2,'#463321');rect(b.x,b.y+8,b.w,b.h-13,'#986334');rect(b.x+8,b.y+16,b.w-16,b.h-29,'#c58b48');for(let k=0;k<5;k++)line(b.x+16,b.y+37+k*20,b.x+b.w-16,b.y+37+k*20,'#8b5b2e',5);for(let k=0;k<9;k++)line(b.x+18+k*25,b.y+20,b.x+18+k*25,b.y+b.h-12,'#9c6732',4);rect(b.x+9,b.y-18,b.w-18,43,'#253e3c');rect(b.x+14,b.y-13,b.w-28,33,'#35594c');txt(b.name,b.x+b.w/2,b.y+10,21,'#ffe9b2');txt('× '+state.basketCounts[i],b.x+b.w/2,b.y+105,27,'#fff1cc');if(state.drag&&state.drag.x>=b.x-8&&state.drag.x<=b.x+b.w+8&&state.drag.y>=b.y-15&&state.drag.y<=b.y+b.h+16){ctx.strokeStyle='#fff5a8';ctx.lineWidth=5;ctx.strokeRect(b.x-9,b.y-22,b.w+18,b.h+25)}}if(state.drag){potato(state.drag.x,state.drag.y,[25,43,66][state.selected],3)}if(state.done){rect(135,184,690,172,'#1b3434');rect(143,192,674,156,'#e8d5a6');txt('УРОЖАЙ ВІДСОРТОВАНО!',480,245,35,'#4e3b25');txt(`Очки: ${state.score}  •  Помилки: ${state.errors}`,480,292,23,'#4e3b25');txt('Час: '+((state.endTime-state.startTime)/1000).toFixed(1)+' с  •  Натисни «Нова гра»',480,329,18,'#4e3b25')}for(let j=particles.length-1;j>=0;j--){let p=particles[j];rect(p.x,p.y,6,6,p.color);p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--;if(p.life<=0)particles.splice(j,1)}requestAnimationFrame(draw)}reset();draw()})();
<\/script><script>addEventListener('keydown',e=>{if(e.key==='Escape'){try{parent.postMessage({type:'mini-close'},'*')}catch(_){}}});<\/script></body></html>

  ctx.font = uiFont(11, true); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#f5edcb'; ctx.fillText('КАРТА · ВЕРБА', VW / 2 * S, 15 * S);
  // the whole village is on one screen now: small labels, and a label that would overlap one already drawn is skipped
  ctx.font = uiFont(5, true);
  const placed = [];
  for (const L of LABELS) {
    const sx = (mx + L.x * sc) * S, sy = (my + (L.y + 16) * sc) * S, w = ctx.measureText(L.text).width + 5 * S, h = 8 * S;
    const box = [sx - w / 2, sy - h / 2, sx + w / 2, sy + h / 2];
    if (placed.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) continue;
    placed.push(box);
    ctx.fillStyle = 'rgba(251,242,212,.92)'; ctx.fillRect(box[0], box[1], w, h); ctx.fillStyle = '#2e2a26'; ctx.fillText(L.text, sx, sy + 0.5 * S);
  }
  const h = heroPixel();
  if (Math.floor(ui.time * 4) % 2) { ctx.fillStyle = '#e8303a'; ctx.beginPath(); ctx.arc((mx + (h.x + 8) * sc) * S, (my + (h.y + 8) * sc) * S, 3.5 * S, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = S; ctx.stroke(); }
  ctx.font = uiFont(7); ctx.fillStyle = '#c9d4d6'; ctx.fillText('M / Esc — закрити', VW / 2 * S, (VH - 8) * S);
}

// ---------- loop ----------
let last = performance.now();
function frame(t) { const dt = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t; update(dt); render(); requestAnimationFrame(frame); }
renderWorld();
resize();
say('Знову у Вербі… Тьомка, мабуть, як завжди біля пожежки. А на парковці — Loncin, Ява і MT 200. (WASD — рух, E — дія)', 'Олег');
requestAnimationFrame(frame);

window.VERBA = { P, ui, input, update, render, solid, kind, things, passable, action, resetHero, M, groundC, overC, HERO, PORTRAIT, atMiniDoor, MINI_GARAGE, bikes, MOTO, mountBike, dismount, frontBike, npc, frontNpc, talkToTyomka, npcPath, NPC_SPOTS, wallet, addMoney, setMoney, saveWallet, openMini, closeMini };
